# Acesso local HTTP em 127.0.0.1; LOCAL_PORT opcional (padrão: 5173).
# Cada nome de projeto (-p) possui seu próprio banco e imagens.
services:
  local-api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL com host db para Docker}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: http://localhost:${LOCAL_PORT:-5173}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PHOTO_STORAGE_DIR: /app/property-photos
    volumes:
      - photo_data:/app/property-photos
    depends_on:
      db:
        condition: service_healthy
  local-web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ['127.0.0.1:${LOCAL_PORT:-5173}:80']
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [local-api]
